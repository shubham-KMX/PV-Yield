name: CI

# Run on every push and pull request to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---- Frontend: type-check + production build -------------------------
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        # A dummy API URL is fine — the build doesn't call the backend.
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ---- Backend: install + import/syntax check --------------------------
  backend:
    name: Backend check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (CPU torch)
        run: pip install -r requirements.txt

      - name: Import check
        # A dummy key satisfies the required setting; no real API calls run.
        env:
          GOOGLE_MAPS_API_KEY: ci-dummy-key
        run: python -c "import app.main; print('backend imports OK')"
